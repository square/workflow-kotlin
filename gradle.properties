org.gradle.jvmargs='-Dfile.encoding=UTF-8'
org.gradle.parallel=true
android.useAndroidX=true
# Uncomment this to diagnose "API $s is obsolete" warnings. Commented out b/c it's pretty noisy.
#android.debug.obsoleteApi=true

# Required to publish to Nexus (see https://github.com/gradle/gradle/issues/11308)
systemProp.org.gradle.internal.publish.checksums.insecure=true

GROUP=com.squareup.workflow1
VERSION_NAME=1.30.0-SNAPSHOT
LAST_PUBLISHED_VERSION_NAME=1.29.1

POM_DESCRIPTION=Square Workflow

POM_URL=https://github.com/square/workflow/
POM_SCM_URL=https://github.com/square/workflow/
POM_SCM_CONNECTION=scm:git:git://github.com/square/workflow.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/square/workflow.git

POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=http://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_DEVELOPER_ID=square
POM_DEVELOPER_NAME=Square, Inc.
POM_DEVELOPER_URL=https://github.com/square/
SONATYPE_STAGING_PROFILE=com.squareup

org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# Dokka's KotlinAdapter and the com.rickbusarow.ktlint plugin both read
# KotlinAndroidProjectExtension.sourceSets, which KGP deprecated (KT-74451). That makes every
# Android module they see log a "sourceSets collection in Kotlin Android is deprecated" warning
# that we can't do anything about: even the latest Dokka (2.2.0 as of this writing) still reads
# it, ktlint 0.2.2 is that plugin's final release, and no code in this repo touches the
# deprecated collection. Drop this once every plugin reading it has migrated off the getter.
# (KGP reports the diagnostic once per project, so fixing only one consumer changes nothing.)
kotlin.suppressGradlePluginWarnings=SourceSetsAccessInAndroidExtension
